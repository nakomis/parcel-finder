[project]
name = "parcel-finder"
version = "0.1.0"
description = "Links a photo of a delivered parcel to the Claude Code session where it was bought."
requires-python = ">=3.11"
dependencies = ["anthropic>=2.1"]

[project.scripts]
parcel-finder = "parcel_finder.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parcel_finder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
